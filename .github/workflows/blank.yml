name: Generate and Build Unsigned App Store

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate_and_compile:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Project Generation Script
      run: |
        python generate_app_store_project.py

    - name: Install Project Builder Engine
      run: brew install xcodegen

    - name: Generate Precise Xcode Workspace Project
      run: xcodegen generate

    - name: Commit Generated Project Structure back to GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add AppStoreProject/ project.yml AppStoreProject.xcodeproj/
        if git diff --staged --quiet; then
          echo "No changes found."
        else
          git commit -m "Provisioned compilable app structures"
          git push origin main
        fi

    - name: Compile Project with Xcode
      run: |
        xcodebuild -project AppStoreProject.xcodeproj \
                   -scheme AppStoreProject \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   -archivePath $RUNNER_TEMP/AppStore.xcarchive \
                   clean archive

    - name: Package App Bundle into Portable IPA
      run: |
        mkdir -p $RUNNER_TEMP/Payload
        cp -R $RUNNER_TEMP/AppStore.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
        cd $RUNNER_TEMP
        zip -r CustomAppStore_Unsigned.ipa Payload

    - name: Upload Unsigned IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CustomAppStore-Unsigned-Build
        path: ${{ runner.temp }}/CustomAppStore_Unsigned.ipa
