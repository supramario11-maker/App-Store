  name: Generate and Build Unsigned App Store

on:
  push:
    branches: [ "main" ] # Runs automatically every time you push code changes to the main branch
  workflow_dispatch: # Allows you to manually click "Run workflow" inside GitHub web interface

jobs:
  generate_and_compile:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Step 1: Execute your python automation script to generate the Xcode structure
    - name: Run Project Generation Script
      run: |
        if [ -f "generate_app_store_project.py" ]; then
          python generate_app_store_project.py
        else
          echo "Error: generate_app_store_project.py file not found in the root directory!"
          exit 1
        fi

    # Step 2: Compile the generated app bundle while completely bypassing Apple certificates
    - name: Compile Generated Project with Xcode
      run: |
        xcodebuild -project AppStoreProject.xcodeproj \
                   -scheme AppStoreProject \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   -archivePath $RUNNER_TEMP/AppStore.xcarchive \
                   clean archive

    # Step 3: Package the compiled components into the standard .ipa file structure 
    - name: Package App Bundle into Portable IPA
      run: |
        mkdir -p $RUNNER_TEMP/Payload
        cp -R $RUNNER_TEMP/AppStore.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
        cd $RUNNER_TEMP
        zip -r CustomAppStore_Unsigned.ipa Payload

    # Step 4: Save the final unsigned archive so you can download it onto your iPad
    - name: Upload Unsigned IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CustomAppStore-Unsigned-Build
        path: ${{ runner.temp }}/CustomAppStore_Unsigned.ipa
